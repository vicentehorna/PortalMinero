{% extends "layout.html" %}

{% block title %}Documentos del personal{% endblock %}

{% block extra_css %}
<style>
    .table-scroll-container {
        max-height: 65vh;
        overflow: auto;
        border: 1px solid #dee2e6;
    }

    .table-docs {
        --sticky-col1-w: 5.75rem;
        font-size: 11px;
        white-space: nowrap;
        margin-bottom: 0;
    }

    .table-docs th,
    .table-docs td {
        padding: 0.12rem 0.3rem;
        vertical-align: middle;
    }

    .table-docs td.td-descarga-doc {
        text-align: center;
        vertical-align: middle;
        padding: 0.15rem 0.25rem;
    }

    .table-docs .doc-download-trigger {
        appearance: none;
        border: none;
        background: transparent;
        margin: 0 auto;
        padding: 0.2rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        line-height: 1;
        color: #6c757d;
        transition: color 0.15s ease, transform 0.15s ease;
    }

    .table-docs .doc-download-trigger .bi {
        font-size: 1.1rem;
        line-height: 1;
        pointer-events: none;
    }

    .table-docs .doc-download-trigger:hover,
    .table-docs .doc-download-trigger:focus-visible {
        color: #3498db;
        transform: scale(1.2);
    }

    .table-docs .doc-download-trigger:focus-visible {
        outline: 2px solid rgba(52, 152, 219, 0.45);
        outline-offset: 2px;
    }

    .table-docs thead th {
        position: sticky;
        top: 0;
        background-color: #f8f9fa;
        z-index: 2;
        box-shadow: 0 1px 0 #dee2e6;
    }

    .table-docs .sticky-col-1 {
        position: sticky;
        left: 0;
        z-index: 1;
        background-color: #fff;
        min-width: var(--sticky-col1-w);
        width: var(--sticky-col1-w);
        max-width: var(--sticky-col1-w);
        box-sizing: border-box;
    }

    .table-docs .sticky-col-2 {
        position: sticky;
        left: var(--sticky-col1-w);
        z-index: 1;
        background-color: #fff;
        min-width: 13rem;
        max-width: 14rem;
        box-sizing: border-box;
    }

    .table-docs thead th.sticky-col-1,
    .table-docs thead th.sticky-col-2 {
        z-index: 3;
        background-color: #f8f9fa;
    }

    /* Filtros reporte documentos */
    .doc-filtro-empleado .form-select,
    .doc-filtro-dni .form-control,
    .doc-filtro-nombre .form-control {
        min-width: 0;
    }
    .doc-filtro-periodo .form-select,
    .doc-filtro-tipo-documento .form-select {
        width: 8.5rem;
        max-width: 100%;
    }
    @media (min-width: 768px) {
        .doc-filtro-periodo,
        .doc-filtro-tipo-documento {
            flex: 0 0 auto;
            width: auto;
        }
    }
    .doc-filtro-tipo-documento {
        background-color: #e8f2fc;
        padding: 0.25rem 0.35rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="card shadow-sm border-0 mb-4">
    <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
        <h5 class="mb-0 fw-bold text-secondary"><i class="bi bi-folder2-open"></i> Documentos del personal</h5>
    </div>
    <div class="card-body">
        <form id="frmDocumentosPersonal">
            <div class="row g-2 g-lg-2 align-items-end">
                <div class="col-12 col-md-6 col-lg-3">
                    <label for="cboCompania" class="form-label small fw-bold text-muted">Compañía</label>
                    <select id="cboCompania" class="form-select form-select-sm" required
                        {% if minero_restringe_compania %}disabled title="Su perfil solo permite consultar su compañía"{% endif %}>
                        {% if minero_restringe_compania %}
                        <option value="{{ minero_compania_codigo }}" selected>{{ minero_compania_text }}</option>
                        {% else %}
                        <option value="">Seleccione...</option>
                        {% endif %}
                    </select>
                </div>
                <div class="col-6 col-md-auto doc-filtro-periodo">
                    <label for="cboPeriodo" class="form-label small fw-bold text-muted">Periodo</label>
                    <select id="cboPeriodo" class="form-select form-select-sm" required disabled>
                        <option value="">Seleccione compañía...</option>
                    </select>
                </div>
                <div class="col-12 col-md col-lg doc-filtro-empleado">
                    <label for="cboTrabajador" class="form-label small fw-bold text-muted">Empleado
                        {% if not simple_restringe_trabajador %}<span class="fw-normal opacity-75">(opcional)</span>{% endif %}
                    </label>
                    <select id="cboTrabajador" class="form-select form-select-sm"
                        {% if simple_restringe_trabajador %}disabled title="Su perfil solo permite consultar sus documentos"{% else %}disabled{% endif %}>
                        {% if simple_restringe_trabajador %}
                        <option value="{{ simple_trabajador_codigo }}" selected>{{ simple_trabajador_nombre }}</option>
                        {% else %}
                        <option value="">Todos (por defecto)</option>
                        {% endif %}
                    </select>
                </div>
                <div class="col-6 col-md-2 col-lg-2 doc-filtro-dni">
                    <label for="txtDni" class="form-label small fw-bold text-muted">DNI <span class="fw-normal opacity-75">(opcional)</span></label>
                    <input type="text" id="txtDni" class="form-control form-control-sm" placeholder="Buscar..." maxlength="20" autocomplete="off">
                </div>
                <div class="col-6 col-md-auto doc-filtro-tipo-documento">
                    <label for="cboTipoDocumento" class="form-label small fw-bold text-muted">Tipo documento</label>
                    <select id="cboTipoDocumento" class="form-select form-select-sm">
                        <option value="0">Todos</option>
                    </select>
                </div>
            </div>
            <div class="row g-2 align-items-end mt-1">
                <div class="col-12 col-md-6 col-lg-3 doc-filtro-nombre">
                    <label for="txtNombre" class="form-label small fw-bold text-muted">Nombre <span class="fw-normal opacity-75">(opcional)</span></label>
                    <input type="text" id="txtNombre" class="form-control form-control-sm" placeholder="Buscar por nombre del empleado..." maxlength="100" autocomplete="off">
                </div>
            </div>
            <div class="row">
            <div class="col-12 d-flex align-items-center flex-wrap gap-2 border-top pt-3 mt-3">
                <button type="submit" class="btn btn-primary btn-sm px-4"><i class="bi bi-search"></i> Consultar</button>
                <button type="button" class="btn btn-success btn-sm px-4" id="btnExportExcelDocs" disabled><i class="bi bi-file-earmark-excel"></i> Exportar a Excel</button>
                <span class="ms-auto text-muted small fw-bold">No. de Registros: <span id="lblRowCountDocs">0</span></span>
            </div>
            </div>
        </form>
    </div>
</div>

<div class="card shadow-sm border-0 d-none" id="cardResultadoDocs">
    <div class="card-body">
        <h4 class="text-center fw-bold mb-3">DOCUMENTOS DEL PERSONAL</h4>
        <div class="table-scroll-container">
            <table class="table table-bordered table-sm table-hover table-docs align-middle">
                <thead id="thead-docs"></thead>
                <tbody id="tbody-docs"></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/filtros_reportes_planillas.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function () {
    const filtrosPersist = window.FiltrosPlanillasReportes && window.FiltrosPlanillasReportes.documentosPersonal
        ? window.FiltrosPlanillasReportes.documentosPersonal()
        : null;
    const URL_REPORTE = {{ url_for('reporte_documentos_personal_post') | tojson }};
    const URL_DESCARGAR = {{ url_for('descargar_documento_personal') | tojson }};
    const RESTRINGE_COMPANIA = {{ (minero_restringe_compania or false) | tojson }};
    const COMPANIA_CODIGO = {{ (minero_compania_codigo or '') | tojson }};
    const SIMPLE_RESTRINGE_TRABAJADOR = {{ (simple_restringe_trabajador or false) | tojson }};
    const SIMPLE_TRABAJADOR_CODIGO = {{ (simple_trabajador_codigo or '') | tojson }};
    const IDX_STICKY_1 = 0;
    const IDX_STICKY_2 = 1;
    const IDX_CENTRO = new Set([2, 3, 4, 5]);
    const COL_DESCARGAR = 6;

    let lastExportDocumentosPersonal = null;

    function selectedText(id) {
        const el = document.getElementById(id);
        const opt = el && el.options[el.selectedIndex];
        return opt ? opt.textContent.trim() : '';
    }

    function headersParaExcel(headers) {
        const h = headers || [];
        if (h.length && String(h[h.length - 1]).toLowerCase().indexOf('descargar') !== -1) {
            return h.slice(0, -1);
        }
        return h.slice();
    }

    function filaParaExcel(rowVals) {
        const r = rowVals || [];
        const out = [];
        for (let i = 0; i < r.length && i < COL_DESCARGAR; i++) {
            const v = r[i];
            out.push(v == null ? '' : String(v));
        }
        return out;
    }

    function escapeHtml(s) {
        return String(s || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/"/g, '&quot;');
    }

    function optionExists(select, value) {
        if (!select || value === '' || value == null) return false;
        const v = String(value);
        return Array.from(select.options).some((o) => o.value === v);
    }

    function seleccionarCompaniaInsensitive(select, codigoDeseado) {
        if (!select) return false;
        const want = String(codigoDeseado || '').trim().toUpperCase();
        if (!want) return false;
        const opt = Array.from(select.options).find((o) => String(o.value || '').trim().toUpperCase() === want);
        if (!opt) return false;
        select.value = opt.value;
        return true;
    }

    function limpiarValorComboSiObsoleto(select) {
        if (!select) return;
        const v = String(select.value || '').trim();
        if (!v) return;
        const ok = Array.from(select.options).some((o) => String(o.value) === v);
        if (!ok) select.value = '';
    }

    function etiquetaTrabajadorTodosPorDefecto(selectElement) {
        if (!selectElement || !selectElement.options.length) return;
        const o = selectElement.options[0];
        if (o && o.value === '') o.textContent = 'Todos (por defecto)';
    }

    function filenameFromContentDisposition(header) {
        if (!header || typeof header !== 'string') return 'documento.pdf';
        const mStar = /filename\*=(?:UTF-8'')?([^;\n]+)/i.exec(header);
        if (mStar) {
            let raw = mStar[1].trim().replace(/^["']|["']$/g, '');
            try {
                return decodeURIComponent(raw);
            } catch (e) {
                return raw || 'documento.pdf';
            }
        }
        const m = /filename="([^"]+)"/i.exec(header);
        if (m) return m[1].trim();
        const m2 = /filename=([^;\s]+)/i.exec(header);
        if (m2) return m2[1].trim().replace(/^["']|["']$/g, '');
        return 'documento.pdf';
    }

    document.getElementById('cardResultadoDocs').addEventListener('click', async function (e) {
        const btn = e.target.closest('.doc-download-trigger');
        if (!btn || btn.disabled) return;
        e.preventDefault();
        const url = btn.getAttribute('data-download-url');
        if (!url) return;
        btn.disabled = true;
        try {
            const res = await fetch(url, {
                credentials: 'same-origin',
                headers: { 'X-Fetch-Descarga': '1' },
            });
            if (!res.ok) {
                const text = await res.text().catch(function () { return ''; });
                let detail = 'No se pudo descargar el documento (código ' + res.status + ').';
                try {
                    const j = JSON.parse(text);
                    if (j && j.error) detail = j.error;
                    if (j && j.code) detail += ' (Ref. soporte: ' + j.code + ')';
                } catch (e2) { /* no es JSON */ }
                alert(detail);
                return;
            }
            const ctype = (res.headers.get('Content-Type') || '').toLowerCase();
            if (ctype.indexOf('text/html') !== -1) {
                alert('La sesión pudo haber expirado. Vuelva a iniciar sesión e intente de nuevo.');
                return;
            }
            const blob = await res.blob();
            const name = filenameFromContentDisposition(res.headers.get('Content-Disposition'));
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = name;
            a.rel = 'noopener';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(a.href);
            await ejecutarConsulta();
        } catch (err) {
            console.error(err);
            alert('Error de red al descargar el documento.');
        } finally {
            btn.disabled = false;
        }
    });

    function renderizarTablaDocs(payload) {
        const thead = document.getElementById('thead-docs');
        const tbody = document.getElementById('tbody-docs');
        const headers = payload.headers || [];
        const filas = payload.data || [];

        let htmlHeaders = '<tr>';
        headers.forEach((header, index) => {
            let sticky = '';
            if (index === IDX_STICKY_1) sticky = 'sticky-col-1';
            else if (index === IDX_STICKY_2) sticky = 'sticky-col-2';
            const cen = IDX_CENTRO.has(index) ? ' text-center' : '';
            htmlHeaders += `<th class="${sticky}${cen}">${escapeHtml(header)}</th>`;
        });
        htmlHeaders += '</tr>';
        thead.innerHTML = htmlHeaders;

        let htmlBody = '';
        filas.forEach((rowVals) => {
            htmlBody += '<tr>';
            (rowVals || []).forEach((valor, index) => {
                let sticky = '';
                if (index === IDX_STICKY_1) sticky = 'sticky-col-1 font-monospace fw-bold';
                else if (index === IDX_STICKY_2) sticky = 'sticky-col-2 text-truncate';
                let align = IDX_CENTRO.has(index) ? 'text-center' : '';

                if (index === COL_DESCARGAR && valor && typeof valor === 'object' && valor.drivefileid) {
                    const q = new URLSearchParams({
                        file_id: String(valor.drivefileid || ''),
                        person: String(valor.person || ''),
                        period: String(valor.period || ''),
                        tipodocumento: String(valor.tipodocumento || ''),
                        cia: String(valor.cia || ''),
                    });
                    const downloadUrl = URL_DESCARGAR + '?' + q.toString();
                    htmlBody += `<td class="${[sticky, align, 'td-descarga-doc'].filter(Boolean).join(' ')}">
                        <button type="button" class="doc-download-trigger" data-download-url="${escapeHtml(downloadUrl)}" title="Descargar documento">
                            <i class="bi bi-download" aria-hidden="true"></i>
                        </button>
                    </td>`;
                } else {
                    htmlBody += `<td class="${[sticky, align].filter(Boolean).join(' ')}">${escapeHtml(valor)}</td>`;
                }
            });
            htmlBody += '</tr>';
        });

        tbody.innerHTML = htmlBody;
        document.getElementById('lblRowCountDocs').textContent = String(filas.length);
    }

    async function exportDocumentosPersonalExcel(payload, meta) {
        if (typeof ExcelJS === 'undefined') {
            alert('No se pudo cargar la librería de Excel (ExcelJS). Recargue la página e intente de nuevo.');
            return;
        }
        const headersAll = payload.headers || [];
        const headers = headersParaExcel(headersAll);
        const filasRaw = payload.data || [];
        const filas = filasRaw.map(filaParaExcel);
        const ncols = headers.length;
        if (!ncols) return;

        const F = {
            title: 'FFE9ECEF',
            meta: 'FFF8F9FA',
            header: 'FFF8F9FA',
            data: 'FFFFFFFF'
        };
        const fill = (argb) => ({ type: 'pattern', pattern: 'solid', fgColor: { argb } });
        const borderThin = { style: 'thin', color: { argb: 'FFCCCCCC' } };
        const allBorders = { top: borderThin, left: borderThin, bottom: borderThin, right: borderThin };
        const alignCenter = { horizontal: 'center', vertical: 'middle' };

        const wb = new ExcelJS.Workbook();
        const ws = wb.addWorksheet('Documentos', { views: [{ showGridLines: true }] });

        let rowIdx = 1;
        ws.mergeCells(rowIdx, 1, rowIdx, ncols);
        const titleCell = ws.getCell(rowIdx, 1);
        titleCell.value = 'DOCUMENTOS DEL PERSONAL';
        titleCell.font = { bold: true, size: 14 };
        titleCell.alignment = { horizontal: 'center', vertical: 'middle' };
        titleCell.fill = fill(F.title);
        titleCell.border = allBorders;
        ws.getRow(rowIdx).height = 26;
        rowIdx++;

        const metaRow1 = ws.addRow([
            'Compañía', meta.compania || '',
            'Periodo', meta.periodo || ''
        ]);
        metaRow1.eachCell({ includeEmpty: true }, (cell, colNumber) => {
            if (colNumber <= 6) {
                cell.fill = fill(F.meta);
                cell.font = { bold: colNumber % 2 === 1 };
                cell.alignment = alignCenter;
            }
            cell.border = allBorders;
        });
        rowIdx++;

        const metaRow2 = ws.addRow([
            'Tipo documento', meta.tipoDocumento || '',
            'Empleado', meta.empleado || '',
            'DNI', meta.dni || ''
        ]);
        metaRow2.eachCell({ includeEmpty: true }, (cell, colNumber) => {
            if (colNumber <= 6) {
                cell.fill = fill(F.meta);
                cell.font = { bold: colNumber % 2 === 1 };
                cell.alignment = alignCenter;
            }
            cell.border = allBorders;
        });
        rowIdx++;

        ws.addRow([]);
        rowIdx++;

        const IDX_CENTRO_XL = new Set([2, 3, 4, 5]);
        const hRow = ws.addRow(headers);
        hRow.font = { bold: true };
        hRow.eachCell({ includeEmpty: true }, (cell, colNumber) => {
            const idx = colNumber - 1;
            cell.fill = fill(F.header);
            if (idx === 1) {
                cell.alignment = { horizontal: 'left', vertical: 'middle' };
            } else if (IDX_CENTRO_XL.has(idx)) {
                cell.alignment = alignCenter;
            } else {
                cell.alignment = alignCenter;
            }
            cell.border = allBorders;
        });
        rowIdx++;

        filas.forEach((rowVals) => {
            const r = ws.addRow(rowVals || []);
            r.eachCell({ includeEmpty: true }, (cell, colNumber) => {
                const idx = colNumber - 1;
                cell.fill = fill(F.data);
                cell.border = allBorders;
                if (idx === 1) {
                    cell.alignment = { horizontal: 'left', vertical: 'middle' };
                } else if (IDX_CENTRO_XL.has(idx)) {
                    cell.alignment = alignCenter;
                } else {
                    cell.alignment = alignCenter;
                }
            });
            rowIdx++;
        });

        ws.getColumn(1).width = 12;
        ws.getColumn(2).width = 36;
        ws.getColumn(3).width = 16;
        ws.getColumn(4).width = 12;
        ws.getColumn(5).width = 20;
        ws.getColumn(6).width = 20;

        const buffer = await wb.xlsx.writeBuffer();
        const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const safe = (s) => String(s || 'export').replace(/[\\/:*?"<>|]+/g, '_').trim().slice(0, 80);
        const stamp = new Date().toISOString().slice(0, 10);
        a.download = `documentos_personal_${safe(meta.compania)}_${stamp}.xlsx`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
    }

    const poblarSelect = async (url, selectElement) => {
        selectElement.innerHTML = '';
        const loading = document.createElement('option');
        loading.value = '';
        loading.textContent = 'Cargando...';
        selectElement.appendChild(loading);
        try {
            const res = await fetch(url);
            const data = await res.json();
            selectElement.innerHTML = '';
            const def = document.createElement('option');
            def.value = '';
            def.textContent = 'Seleccione...';
            selectElement.appendChild(def);
            (Array.isArray(data) ? data : []).forEach((item) => {
                const opt = document.createElement('option');
                opt.value = item.id != null ? String(item.id) : '';
                opt.textContent = item.text != null ? String(item.text) : '';
                selectElement.appendChild(opt);
            });
            selectElement.disabled = false;
        } catch (err) {
            console.error(err);
            selectElement.innerHTML = '<option value="">Error</option>';
        }
    };

    async function poblarTiposDocumento(selectElement) {
        if (!selectElement) return;
        selectElement.innerHTML = '';
        const loading = document.createElement('option');
        loading.value = '';
        loading.textContent = 'Cargando...';
        selectElement.appendChild(loading);
        try {
            const res = await fetch('/api/selectores/tipos-documento');
            const data = await res.json();
            selectElement.innerHTML = '';
            const optTodos = document.createElement('option');
            optTodos.value = '0';
            optTodos.textContent = 'Todos';
            selectElement.appendChild(optTodos);
            (Array.isArray(data) ? data : []).forEach((item) => {
                const opt = document.createElement('option');
                opt.value = item.id != null ? String(item.id) : '';
                opt.textContent = item.text != null ? String(item.text) : '';
                if (opt.value) selectElement.appendChild(opt);
            });
            selectElement.value = '0';
        } catch (err) {
            console.error(err);
            selectElement.innerHTML = '<option value="0">Todos</option>';
            selectElement.value = '0';
        }
    }

    async function fetchPeriodoActivo(cia) {
        try {
            const res = await fetch(`/api/selectores/periodo-activo?cia=${encodeURIComponent(cia)}`);
            const data = await res.json();
            return String(data.prperiod || data.id || '').trim();
        } catch (err) {
            console.error(err);
            return '';
        }
    }

    function normalizarPeriodo(val) {
        return String(val || '').replace(/\D/g, '').trim();
    }

    function buscarOptionPeriodo(selectElement, periodo) {
        const want = normalizarPeriodo(periodo);
        if (!want || !selectElement) return null;
        return Array.from(selectElement.options).find((o) => normalizarPeriodo(o.value) === want) || null;
    }

    function agregarPeriodoSiFalta(selectElement, periodo) {
        const p = String(periodo || '').trim();
        if (!p || buscarOptionPeriodo(selectElement, p)) return;
        const opt = document.createElement('option');
        opt.value = p;
        opt.textContent = p;
        const ref = selectElement.options.length > 1 ? selectElement.options[1] : null;
        if (ref) {
            selectElement.insertBefore(opt, ref);
        } else {
            selectElement.appendChild(opt);
        }
    }

    function resolverPeriodoPorDefecto(selectElement, periodoActivo) {
        const opt = buscarOptionPeriodo(selectElement, periodoActivo);
        if (opt) return opt.value;
        return optionExists(selectElement, '0') ? '0' : '';
    }

    async function poblarPeriodos(cia, selectElement) {
        selectElement.innerHTML = '';
        const loading = document.createElement('option');
        loading.value = '';
        loading.textContent = 'Cargando...';
        selectElement.appendChild(loading);
        try {
            const [res, periodoActivo] = await Promise.all([
                fetch(`/api/selectores/periodos-asig?cia=${encodeURIComponent(cia)}`),
                fetchPeriodoActivo(cia),
            ]);
            const data = await res.json();
            selectElement.innerHTML = '';
            const optTodos = document.createElement('option');
            optTodos.value = '0';
            optTodos.textContent = 'Todos';
            selectElement.appendChild(optTodos);
            (Array.isArray(data) ? data : []).forEach((item) => {
                const opt = document.createElement('option');
                opt.value = item.id != null ? String(item.id) : '';
                opt.textContent = item.text != null ? String(item.text) : '';
                selectElement.appendChild(opt);
            });
            agregarPeriodoSiFalta(selectElement, periodoActivo);
            selectElement.value = resolverPeriodoPorDefecto(selectElement, periodoActivo);
            selectElement.disabled = false;
        } catch (err) {
            console.error(err);
            selectElement.innerHTML = '<option value="0">Todos</option>';
            selectElement.value = '0';
            selectElement.disabled = false;
        }
    }

    async function ejecutarConsulta() {
        lastExportDocumentosPersonal = null;
        document.getElementById('btnExportExcelDocs').disabled = true;
        if (filtrosPersist) filtrosPersist.guardar();
        const cia = document.getElementById('cboCompania').value.trim();
        const period = document.getElementById('cboPeriodo').value.trim() || '0';
        let person = document.getElementById('cboTrabajador').value.trim();
        if (SIMPLE_RESTRINGE_TRABAJADOR && SIMPLE_TRABAJADOR_CODIGO) {
            person = SIMPLE_TRABAJADOR_CODIGO;
        } else if (!person) {
            person = '0';
        }
        let tipodoc = document.getElementById('cboTipoDocumento').value.trim();
        if (!tipodoc) tipodoc = '0';
        const dni = document.getElementById('txtDni').value.trim();
        const nombre = document.getElementById('txtNombre').value.trim();

        try {
            const res = await fetch(URL_REPORTE, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cia, period, person, tipodoc, dni, nombre }),
            });
            const payload = await res.json();
            if (!res.ok || payload.error) {
                document.getElementById('cardResultadoDocs').classList.add('d-none');
                document.getElementById('lblRowCountDocs').textContent = '0';
                alert(payload.error || 'Error al generar el reporte.');
                return;
            }
            if (!Array.isArray(payload.headers) || !Array.isArray(payload.data)) {
                alert('Respuesta inválida del servidor.');
                document.getElementById('cardResultadoDocs').classList.add('d-none');
                document.getElementById('lblRowCountDocs').textContent = '0';
                return;
            }
            document.getElementById('cardResultadoDocs').classList.remove('d-none');
            renderizarTablaDocs(payload);
            lastExportDocumentosPersonal = {
                headers: payload.headers,
                data: payload.data,
                meta: {
                    compania: selectedText('cboCompania'),
                    periodo: selectedText('cboPeriodo'),
                    tipoDocumento: selectedText('cboTipoDocumento'),
                    empleado: selectedText('cboTrabajador'),
                    dni: document.getElementById('txtDni').value.trim(),
                    nombre: document.getElementById('txtNombre').value.trim(),
                },
            };
            document.getElementById('btnExportExcelDocs').disabled = false;
        } catch (e) {
            console.error(e);
            document.getElementById('cardResultadoDocs').classList.add('d-none');
            document.getElementById('lblRowCountDocs').textContent = '0';
            document.getElementById('btnExportExcelDocs').disabled = true;
            alert('Error de red o del servidor.');
        }
    }

    const DEFAULT_CIA = 'BGT';
    const cboCia = document.getElementById('cboCompania');
    const cboPeriodo = document.getElementById('cboPeriodo');
    const cboTrabajador = document.getElementById('cboTrabajador');
    const cboTipoDocumento = document.getElementById('cboTipoDocumento');
    const guardadoObj = filtrosPersist ? filtrosPersist.leer() : null;

    await poblarTiposDocumento(cboTipoDocumento);
    if (guardadoObj && guardadoObj.tipodoc != null) {
        const td = String(guardadoObj.tipodoc).trim();
        if (td && optionExists(cboTipoDocumento, td)) {
            cboTipoDocumento.value = td;
        }
    }

    if (!RESTRINGE_COMPANIA) {
        await poblarSelect('/api/selectores/companias', cboCia);
        limpiarValorComboSiObsoleto(cboCia);

        const ciaGuardada = guardadoObj ? String(guardadoObj.cia || '').trim() : '';
        if (ciaGuardada && optionExists(cboCia, ciaGuardada)) {
            cboCia.value = ciaGuardada;
        } else if (!String(cboCia.value || '').trim()) {
            seleccionarCompaniaInsensitive(cboCia, DEFAULT_CIA);
        }

        const ciaNorm = cboCia.value.trim();
        if (ciaNorm) {
            if (!SIMPLE_RESTRINGE_TRABAJADOR) {
                await poblarSelect(`/api/selectores/trabajadores?cia=${encodeURIComponent(ciaNorm)}`, cboTrabajador);
                etiquetaTrabajadorTodosPorDefecto(cboTrabajador);
                const person = guardadoObj && guardadoObj.person != null ? String(guardadoObj.person).trim() : '';
                if (person && optionExists(cboTrabajador, person)) {
                    cboTrabajador.value = person;
                }
            }
            await poblarPeriodos(ciaNorm, cboPeriodo);
        }

        const inpDni = document.getElementById('txtDni');
        if (inpDni && guardadoObj && guardadoObj.dni != null) {
            inpDni.value = String(guardadoObj.dni).trim();
        }
        const inpNombre = document.getElementById('txtNombre');
        if (inpNombre && guardadoObj && guardadoObj.nombre != null) {
            inpNombre.value = String(guardadoObj.nombre).trim();
        }
    } else {
        const ciaFix = String(COMPANIA_CODIGO || '').trim();
        if (ciaFix) {
            if (!SIMPLE_RESTRINGE_TRABAJADOR) {
                await poblarSelect(`/api/selectores/trabajadores?cia=${encodeURIComponent(ciaFix)}`, cboTrabajador);
                etiquetaTrabajadorTodosPorDefecto(cboTrabajador);
            }
            await poblarPeriodos(ciaFix, cboPeriodo);
        }
    }

    {
        const cia = cboCia.value.trim();
        const period = document.getElementById('cboPeriodo').value.trim();
        const personOk = SIMPLE_RESTRINGE_TRABAJADOR ? Boolean(SIMPLE_TRABAJADOR_CODIGO) : true;
        if (cia && period && personOk) {
            await ejecutarConsulta();
        }
    }

    if (!RESTRINGE_COMPANIA) {
        document.getElementById('cboCompania').addEventListener('change', async function () {
            const cia = this.value;
            const cboTrabajadorEl = document.getElementById('cboTrabajador');
            const cboPeriodo = document.getElementById('cboPeriodo');
            cboPeriodo.innerHTML = '<option value="">Seleccione compañía...</option>';
            cboPeriodo.disabled = true;

            if (cia) {
                await poblarSelect(`/api/selectores/trabajadores?cia=${encodeURIComponent(cia)}`, cboTrabajadorEl);
                etiquetaTrabajadorTodosPorDefecto(cboTrabajadorEl);
                await poblarPeriodos(cia, cboPeriodo);
            } else {
                cboTrabajadorEl.innerHTML = '<option value="">Seleccione...</option>';
                cboTrabajadorEl.disabled = true;
                etiquetaTrabajadorTodosPorDefecto(cboTrabajadorEl);
            }
        });
    }

    if (filtrosPersist) {
        filtrosPersist.registrarGuardadoEnCambio();
    }

    document.getElementById('frmDocumentosPersonal').addEventListener('submit', async function (e) {
        e.preventDefault();
        await ejecutarConsulta();
    });

    document.getElementById('btnExportExcelDocs').addEventListener('click', async function () {
        if (!lastExportDocumentosPersonal) return;
        try {
            await exportDocumentosPersonalExcel(
                {
                    headers: lastExportDocumentosPersonal.headers,
                    data: lastExportDocumentosPersonal.data,
                },
                lastExportDocumentosPersonal.meta
            );
        } catch (err) {
            console.error(err);
            alert('No se pudo generar el archivo Excel.');
        }
    });
});
</script>
{% endblock %}
