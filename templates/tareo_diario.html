{% extends "layout.html" %}

{% block title %}Tareo diario{% endblock %}

{% block extra_css %}
<style>
    .tareo-toolbar {
        position: sticky;
        top: 0;
        z-index: 5;
        background: #f4f6f9;
        padding-bottom: 0.75rem;
        margin: -0.25rem 0 0.75rem;
    }

    .tareo-resumen {
        font-size: 0.85rem;
    }

    .tareo-card {
        border: 1px solid #e2e8f0;
        border-radius: 0.75rem;
        background: #fff;
        margin-bottom: 0.75rem;
        overflow: hidden;
    }

    .tareo-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        padding: 0.65rem 0.85rem;
        background: #f8fafc;
        border-bottom: 1px solid #edf2f7;
    }

    .tareo-card-nombre {
        font-weight: 600;
        font-size: 0.95rem;
        line-height: 1.25;
        margin: 0;
    }

    .tareo-card-codigo {
        min-width: 2.5rem;
        text-align: center;
        font-weight: 700;
        font-size: 0.8rem;
        padding: 0.2rem 0.45rem;
        border-radius: 999px;
        background: #e9ecef;
        color: #495057;
    }

    .tareo-card-codigo.has-code {
        background: #d1e7dd;
        color: #0f5132;
    }

    .tareo-codigos-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(3.1rem, 1fr));
        gap: 0.35rem;
        padding: 0.65rem 0.85rem 0.8rem;
    }

    .tareo-btn-codigo {
        border: 1px solid #ced4da;
        background: #fff;
        border-radius: 0.5rem;
        padding: 0.35rem 0.15rem;
        font-size: 0.78rem;
        font-weight: 600;
        line-height: 1.1;
        min-height: 2.1rem;
        transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
    }

    .tareo-btn-codigo:hover,
    .tareo-btn-codigo:focus-visible {
        border-color: #3498db;
        color: #3498db;
    }

    .tareo-btn-codigo.active {
        background: #3498db;
        border-color: #3498db;
        color: #fff;
    }

    .tareo-save-bar {
        position: sticky;
        bottom: 0;
        z-index: 6;
        background: linear-gradient(180deg, rgba(244, 246, 249, 0) 0%, #f4f6f9 35%);
        padding: 0.75rem 0 0.25rem;
        margin-top: 0.5rem;
    }

    @media (max-width: 576px) {
        .tareo-codigos-grid {
            grid-template-columns: repeat(5, minmax(0, 1fr));
        }
    }
</style>
{% endblock %}

{% block content %}
<div id="tareoApp"
     data-cia="{{ tareo_company|e }}"
     data-fecha="{{ fecha_default|e }}"
     data-limit="{{ trabajadores_limit }}">

    <div class="tareo-toolbar">
        <div class="d-flex flex-wrap align-items-end gap-2 justify-content-between">
            <div>
                <h5 class="mb-1 fw-bold text-secondary">
                    <i class="bi bi-calendar2-check"></i> Tareo diario
                </h5>
                <p class="text-muted small mb-0">
                    Compañía <strong id="tareoCiaLabel">{{ tareo_company or '—' }}</strong>
                    · MVP: primeros {{ trabajadores_limit }} trabajadores
                </p>
            </div>
            <div class="flex-shrink-0">
                <label for="tareoFecha" class="form-label small fw-bold text-muted mb-1">Fecha</label>
                <input type="date" class="form-control form-control-sm" id="tareoFecha" value="{{ fecha_default }}">
            </div>
        </div>
        <div class="tareo-resumen text-muted mt-2" id="tareoResumen" aria-live="polite">Cargando…</div>
    </div>

    <div id="tareoAlert" class="alert d-none py-2 small" role="alert"></div>
    <div id="tareoLista"></div>

    <div class="tareo-save-bar">
        <button type="button" class="btn btn-primary w-100" id="btnGuardarTareo" disabled>
            <i class="bi bi-save me-1"></i> Guardar tareo del día
        </button>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/tareo_diario.js') }}"></script>
{% endblock %}
