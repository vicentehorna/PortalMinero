# Blueprint Render: https://render.com/docs/blueprint-spec
# Tras el primer deploy, configura en el panel las variables sensibles (.env):
# SQL_SERVER, SQL_DATABASE, SQL_USER, SQL_PASSWORD, FLASK_SECRET_KEY, etc.
# Google Drive (service account): GOOGLE_DRIVE_CREDENTIALS_JSON = contenido completo del JSON (secreto).
#   Alternativa: GOOGLE_DRIVE_CREDENTIALS_FILE con ruta dentro del contenedor si monta el archivo.
# Sustentos vacaciones: GOOGLE_DRIVE_FOLDER_SUSTENTO_VACACIONES = ID/URL carpeta (ideal: unidad compartida).
# Si la carpeta está en Mi unidad: GOOGLE_DRIVE_SUSTENTO_IMPERSONATE_USER + delegación dominio (Workspace).

services:
  - type: web
    name: portal-minero
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
